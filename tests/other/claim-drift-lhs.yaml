description: |
  Statement drift on the left-hand side, through a shared expr node.

  Same construction as `claim-drift-rhs` but the mutation hits the
  *shared* interned literal `2` (expr `ie471`), which the export reuses
  in both the claimed type's left operand and the proof's `rfl`
  argument.  After editing it to `3`, the declaration claims
  `3 + 3 = 4` while the proof is `rfl` of `3 + 3` — still a perfectly
  well-typed term, just a proof of `3 + 3 = 3 + 3`, not of the claimed
  equation.

  A correct checker rejects because `3 + 3` reduces to `6`, not `4`.
  The test additionally probes how a checker handles the export's
  structural sharing: the mutated node is referenced from several
  parents, so a checker that reconstructs terms per-parent rather than
  per-interned-node, or that fails to share the edit consistently, may
  either accept wrongly or reject for the wrong reason.

# Frozen as a static export file: produced by exporting
# tests/other/claim-drift.lean under leanprover/lean4:v4.34.0-rc2
# (lean4export 3.1.0) and editing the single `natVal` node `ie471` from
# 2 to 3.  See `claim-drift-rhs` for the right-hand-side sibling.
file: tests/other/claim-drift-lhs.ndjson
outcome: reject
