description: |
  A valid proof attached to the wrong declaration, mid-stream.

  The export contains two theorems: `claim_drift : 2 + 2 = 4 := rfl`
  (untouched) followed by `claim_drift2 : 3 + 3 = 6 := rfl` — except
  that the second theorem's `value` index has been re-pointed at the
  first theorem's proof term.  The first declaration replays and is
  accepted; the second then claims `3 + 3 = 6` while carrying a proof
  of `2 + 2 = 4`.

  A checker must validate each declaration's value against its own
  declared type rather than trusting declaration order or adjacent
  valid entries: the bad declaration fails after a good one has already
  been accepted, so the test also exercises incremental replay state.
  (The mutation is one-sided — only the second `thm` entry's `value` is
  redirected to expr `486`, which is already defined earlier in the
  stream — precisely so the failure is a type mismatch rather than a
  forward-reference parse error.)

